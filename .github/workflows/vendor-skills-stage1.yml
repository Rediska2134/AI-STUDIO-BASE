name: Vendor Codex skills - stage 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-skills-stage1.yml'

permissions:
  contents: write

jobs:
  vendor-stage-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare npm cache
        run: mkdir -p "$RUNNER_TEMP/npm-cache"

      - name: Ensure existing ui-ux-pro-max is vendored
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          npx -y ui-ux-pro-max-cli@latest init --ai codex --force
          test -f .agents/skills/ui-ux-pro-max/SKILL.md
          test -f .agents/skills/ui-ux-pro-max/scripts/search.py
          test -f .agents/skills/ui-ux-pro-max/data/products.csv

      - name: Install grill-me with required grilling dependency
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          npx --yes skills add https://github.com/mattpocock/skills \
            --skill grill-me \
            --skill grilling \
            --agent codex \
            --copy \
            --yes

      - name: Verify grill-me
        run: |
          test -f .agents/skills/grill-me/SKILL.md
          test -f .agents/skills/grilling/SKILL.md
          grep -q 'Call the Skill tool with "grilling"' .agents/skills/grill-me/SKILL.md

      - name: Install frontend-design
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          npx --yes skills add https://github.com/anthropics/skills \
            --skill frontend-design \
            --agent codex \
            --copy \
            --yes

      - name: Verify frontend-design
        run: |
          test -f .agents/skills/frontend-design/SKILL.md
          test -f .agents/skills/frontend-design/LICENSE.txt

      - name: Install hyperframes
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          npx --yes skills add https://github.com/heygen-com/hyperframes \
            --skill hyperframes \
            --agent codex \
            --copy \
            --yes

      - name: Verify hyperframes
        run: |
          test -f .agents/skills/hyperframes/SKILL.md
          test -d .agents/skills/hyperframes/references
          test -d .agents/skills/hyperframes/scripts
          test -f .agents/skills/hyperframes/references/intent-interview.md
          test -f .agents/skills/hyperframes/scripts/plugin-cli.mjs
          node --check .agents/skills/hyperframes/scripts/plugin-cli.mjs
          node --check .agents/skills/hyperframes/scripts/lib/frame-packets-core.mjs

      - name: Verify autonomous copies
        run: |
          if find .agents/skills -type l -print -quit | grep -q .; then
            echo 'ERROR: symlinks found under .agents/skills; vendored skills must be autonomous copies.'
            find .agents/skills -type l -print
            exit 1
          fi
          printf 'Installed skill directories:\n'
          find .agents/skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort

      - name: Commit vendored stage 1 skills
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/skills
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No skill changes to commit.'
            exit 0
          fi
          git commit -m 'chore: vendor first Codex skills batch'
          git push origin HEAD:main
